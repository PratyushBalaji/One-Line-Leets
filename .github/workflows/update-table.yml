name: Update problem table

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-table
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update and commit tables
        run: |
          git config user.name 'Pratyush Balaji'
          git config user.email '59258572+PratyushBalaji@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            message=$(python .github/misc/update_table.py)
            git add .github/misc/table.csv .github/misc/stats.svg table.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "$message"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
